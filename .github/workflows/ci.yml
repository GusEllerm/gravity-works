name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # CI-MACHINE PIXEL TRUTH (debt N1, Evaluation 2026-10-11 engineering
  # round 2; Decision Log 2026-10-12): the CI-enforced pixel views in
  # tests/e2e/visual.spec.ts (CI_ENFORCED_VIEWS) must have a committed
  # tests/visual/linux/ baseline, generated BY a CI run — pixel truth can no
  # longer live on one Mac only (the bloom-merge clobber stayed green for
  # days). Bootstrap flow, stated: ONE PR, two stages inside it — this job
  # captures any missing view on ubuntu/SwiftShader (the spec's rebase mode
  # also self-checks frame stability with a second consecutive capture) and
  # commits the PNGs to the PR branch, where they arrive as a reviewable PR
  # diff — the human-eyes condition the 2026-10-07 Decision Log objected to
  # for generate-in-CI. `check` needs this job and checks the PR branch head
  # out, so the pixel ASSERT itself runs (green or red) in the same run.
  # Once the PNGs are committed the job is a no-op; on main pushes it is
  # skipped (baselines exist by then or the hole is real and check is red).
  linux-baselines:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture missing linux baselines (no-op once committed)
        run: |
          test -f tests/visual/linux/shell-kitchen01-idle.png || \
            GQA_UPDATE_BASELINES=1 npx playwright test visual -g "game shell kitchen01 idle"
          test -f tests/visual/linux/shell-home-idle.png || \
            GQA_UPDATE_BASELINES=1 npx playwright test visual -g "front-door cross-section idle"
      - name: Commit captured baselines to the PR branch
        run: |
          if [ -n "$(git status --porcelain -- tests/visual/linux)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tests/visual/linux
            git commit -m "freeplay: linux pixel baselines captured on CI (bootstrap job)"
            git push
          else
            echo "linux baselines already committed — bootstrap is a no-op"
          fi

  check:
    needs: linux-baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR runs take the branch HEAD, not the pinned merge ref, so the
          # bootstrap job's committed baselines are visible to the assert.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run replay:all
      # THE TALLY SWEEP (freeplay Lane B — THE TALLY LAW): no single rig
      # farms more than 6 badges/run (measured max 4, booster-farm 3;
      # tools/tally-sweep.mjs publishes the table).
      - run: npm run tally:sweep
      - run: npm test
      - run: npx playwright test
      - name: Install drift + livedocs
        run: |
          curl -fsSL https://drift.fp.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install livedocs
      - run: livedocs verify --repo . --vault docs/vault

  # Stage-6 determinism experiment (Final Report "next" #2): re-derive the
  # par-build hash atlas on another OS/CPU and diff it against the committed
  # docs/vault/Reference/hash-atlas.json. MISMATCH IS REPORTED, NOT GATED —
  # warnings + step summary only; this job never fails itself or the gates
  # above. ubuntu is the experiment (linux-x64 vs the darwin-arm64 atlas);
  # macOS is the cheap self-check (same OS family, different machine).
  determinism-atlas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diff the hash atlas (reported, not gated)
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/hash-atlas.mjs --check | tee atlas.log
      - name: Record the experiment
        if: always()
        run: cat atlas.log >> "$GITHUB_STEP_SUMMARY"
