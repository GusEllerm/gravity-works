name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run replay:all
      # THE TALLY SWEEP (freeplay Lane B — THE TALLY LAW): no single rig
      # farms more than 6 badges/run (measured max 4, booster-farm 3;
      # tools/tally-sweep.mjs publishes the table).
      - run: npm run tally:sweep
      - run: npm test
      - run: npx playwright test
      - name: Install drift + livedocs
        run: |
          curl -fsSL https://drift.fp.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install livedocs
      - run: livedocs verify --repo . --vault docs/vault

  # Stage-6 determinism experiment (Final Report "next" #2): re-derive the
  # par-build hash atlas on another OS/CPU and diff it against the committed
  # docs/vault/Reference/hash-atlas.json. MISMATCH IS REPORTED, NOT GATED —
  # warnings + step summary only; this job never fails itself or the gates
  # above. ubuntu is the experiment (linux-x64 vs the darwin-arm64 atlas);
  # macOS is the cheap self-check (same OS family, different machine).
  determinism-atlas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diff the hash atlas (reported, not gated)
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/hash-atlas.mjs --check | tee atlas.log
      - name: Record the experiment
        if: always()
        run: cat atlas.log >> "$GITHUB_STEP_SUMMARY"
